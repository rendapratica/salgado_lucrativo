<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estoque — Salgado Lucrativo</title>
<meta name="theme-color" content="#3a1d0c">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="estoque" data-title="Estoque" data-sub="Prontos, congelados, validade e todo o histórico de movimentações">
<main id="content" class="content">
  <div id="alerts"></div>
  <div id="summary" class="grid g4"></div>

  <section class="section card">
    <div class="card-head"><h2>Saldo por produto</h2>
      <div class="row"><button class="btn sm gold" type="button" id="btn-entry"></button><button class="btn sm" type="button" id="btn-convert"></button><button class="btn sm" type="button" id="btn-adjust"></button></div></div>
    <div id="balances"></div>
  </section>

  <section class="section card" id="batch-card" hidden>
    <div class="card-head"><h2>Lotes com validade</h2><span class="muted small">As saídas consomem sempre o lote mais antigo primeiro.</span></div>
    <div id="batches"></div>
  </section>

  <section class="section">
    <div class="card-head"><h2>Histórico de movimentações</h2>
      <div class="row"><div class="field" style="min-width:190px"><label class="sr-only" for="flt-prod">Produto</label><select id="flt-prod"></select></div>
      <div class="field" style="min-width:150px"><label class="sr-only" for="flt-type">Tipo</label><select id="flt-type"></select></div>
      <div class="field" style="min-width:160px"><label class="sr-only" for="flt-per">Período</label><select id="flt-per"></select></div></div></div>
    <div id="moves"></div>
  </section>

  <dialog id="dlg" data-modal aria-labelledby="dlg-title">
    <div class="dlg-head"><h2 id="dlg-title">Movimentar estoque</h2><button class="btn ghost icon-only" type="button" data-close aria-label="Fechar"></button></div>
    <form id="form" class="dlg-body" novalidate>
      <p class="muted small" id="dlg-help"></p>
      <div class="form-grid">
        <div class="field c6"><label for="f-product">Produto</label><select id="f-product" name="productId"></select><small class="err" data-err="productId"></small><small class="hint" id="now"></small></div>
        <div class="field c6" id="kind-f"><label for="f-kind" id="kind-label">Estoque</label><select id="f-kind" name="kind"><option value="ready">Pronto</option><option value="frozen">Congelado</option></select></div>
        <div class="field c4 keep" id="qty-f"><label for="f-qty" id="qty-label">Quantidade</label><input type="text" inputmode="numeric" id="f-qty" name="qty" autocomplete="off"><small class="err" data-err="qty"></small></div>
        <div class="field c4 keep" id="new-f" hidden><label for="f-new">Quantidade real contada</label><input type="text" inputmode="numeric" id="f-new" name="newQty" autocomplete="off"><small class="err" data-err="newQty"></small></div>
        <div class="field c4 keep"><label for="f-date">Data</label><input type="date" id="f-date" name="date"><small class="err" data-err="date"></small></div>
        <div class="field c4" id="exp-f"><label for="f-exp">Validade <span class="opt">(opcional)</span></label><input type="date" id="f-exp" name="expiry"><small class="err" data-err="expiry"></small></div>
        <div class="field" id="reason-f"><label for="f-reason" id="reason-label">Motivo</label><input type="text" id="f-reason" name="reason" maxlength="120" autocomplete="off"><small class="err" data-err="reason"></small></div>
      </div>
      <div class="form-actions" style="margin-top:16px"><button class="btn primary" type="submit" id="btn-save">Salvar</button><button class="btn ghost" type="button" data-close>Cancelar</button></div>
    </form>
  </dialog>
</main>
<script src="js/calc.js"></script>
<script src="js/database.js"></script>
<script src="js/art.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/estoque.js"></script>
</body>
</html>
