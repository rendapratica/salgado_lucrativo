<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vendas — Salgado Lucrativo</title>
<meta name="theme-color" content="#3a1d0c">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="vendas" data-title="Vendas e encomendas" data-sub="Vendas concluídas baixam o estoque; encomendas ficam pendentes até a entrega">
<main id="content" class="content">
  <section class="card" id="form-card">
    <div class="card-head"><h2 id="form-title">Registrar venda</h2><span class="pill" id="edit-pill" hidden>Editando</span></div>
    <div id="no-products" hidden></div>
    <form id="form" novalidate>
      <div class="form-grid">
        <div class="field" id="status-row"><span class="label">Tipo de registro</span>
          <div class="segmented" role="group" aria-label="Tipo" id="status"><button type="button" data-s="concluida" class="on">Venda concluída</button><button type="button" data-s="encomenda">Encomenda (a entregar)</button></div>
          <small class="hint" id="status-hint"></small></div>
        <div class="field c6"><label for="f-product">Produto vendido</label><select id="f-product" name="productId"></select><small class="err" data-err="productId"></small><small class="hint" id="stock-now"></small></div>
        <div class="field c3 keep"><label for="f-qty">Quantidade</label><input type="text" inputmode="numeric" id="f-qty" name="qty" placeholder="Ex.: 10" autocomplete="off"><small class="err" data-err="qty"></small></div>
        <div class="field c3 keep"><label for="f-price">Valor unitário</label><input type="text" inputmode="decimal" id="f-price" name="unitPrice" placeholder="0,00" autocomplete="off"><small class="err" data-err="unitPrice"></small></div>
        <div class="field c4 keep"><label for="f-date" id="date-label">Data da venda</label><input type="date" id="f-date" name="date"><small class="err" data-err="date"></small></div>
        <div class="field c4 keep" id="pay-field"><label for="f-payment">Forma de pagamento</label><select id="f-payment" name="payment"></select><small class="err" data-err="payment"></small></div>
        <div class="field c4 keep" id="deliv-field" hidden><label for="f-deliv">Data de entrega</label><input type="date" id="f-deliv" name="deliveryDate"><small class="err" data-err="deliveryDate"></small></div>
        <div class="field c4" id="kind-field"><label for="f-kind">Sai do estoque</label><select id="f-kind" name="stockKind"><option value="ready">Pronto</option><option value="frozen">Congelado</option></select></div>
        <div class="field c6"><label for="f-customer">Cliente <span class="opt">(opcional)</span></label><input type="text" id="f-customer" name="customer" maxlength="80" placeholder="Ex.: Dona Marta" autocomplete="off"><small class="err" data-err="customer"></small></div>
        <div class="field c6"><label for="f-notes">Observações <span class="opt">(opcional)</span></label><input type="text" id="f-notes" name="notes" maxlength="200" placeholder="Ex.: festa de aniversário, retirar às 15h" autocomplete="off"><small class="err" data-err="notes"></small></div>
        <div class="liveline" id="live"></div>
      </div>
      <div class="form-actions" style="margin-top:16px"><button class="btn primary" type="submit" id="btn-save"></button><button class="btn ghost" type="button" id="btn-cancel" hidden>Cancelar edição</button></div>
    </form>
  </section>

  <section class="section" id="orders-sec" hidden>
    <div class="card-head"><h2>Encomendas pendentes</h2><span class="muted small">Não descontam estoque nem entram no faturamento até serem concluídas.</span></div>
    <div id="orders"></div>
  </section>

  <section class="section">
    <div class="card-head"><h2>Histórico de vendas</h2>
      <div class="row"><div class="field" style="min-width:190px"><label class="sr-only" for="flt">Período</label><select id="flt"></select></div>
      <div class="field" style="min-width:170px"><label class="sr-only" for="flt-pay">Pagamento</label><select id="flt-pay"></select></div></div></div>
    <div id="summary" class="grid g4" style="margin-bottom:16px"></div>
    <div id="list"></div>
  </section>

  <dialog id="dlg-complete" data-modal aria-labelledby="dc-title">
    <div class="dlg-head"><h2 id="dc-title">Concluir encomenda</h2><button class="btn ghost icon-only" type="button" data-close aria-label="Fechar"></button></div>
    <form id="form-complete" class="dlg-body" novalidate>
      <p class="muted" id="dc-info"></p>
      <div class="form-grid">
        <div class="field c4 keep"><label for="c-date">Data da venda</label><input type="date" id="c-date" name="date"><small class="err" data-err="date"></small></div>
        <div class="field c4 keep"><label for="c-pay">Forma de pagamento</label><select id="c-pay" name="payment"></select><small class="err" data-err="payment"></small></div>
        <div class="field c4"><label for="c-kind">Sai do estoque</label><select id="c-kind" name="stockKind"><option value="ready">Pronto</option><option value="frozen">Congelado</option></select></div>
      </div>
      <div class="form-actions" style="margin-top:16px"><button class="btn primary" type="submit" id="dc-save">Concluir e baixar estoque</button><button class="btn ghost" type="button" data-close>Cancelar</button></div>
    </form>
  </dialog>
</main>
<script src="js/calc.js"></script>
<script src="js/database.js"></script>
<script src="js/art.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/vendas.js"></script>
</body>
</html>
